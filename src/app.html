<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Set the theme before first paint to avoid a flash. Mirrors theme.svelte.ts:
			// explicit choice in localStorage, else the OS preference.
			try {
				var t = localStorage.getItem('theme');
				var dark =
					t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			} catch (e) {
				/* localStorage/matchMedia unavailable — fall back to the default light theme. */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
